name: Update author analysis evidence chain v2

on:
  push:
    paths:
      - '.github/workflows/update-author-analysis-evidence-chain-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve backslashes in generated JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/update-author-analysis-evidence-chain.py')
          s = p.read_text(encoding='utf-8')
          old = "text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "text, count = re.subn(pattern, lambda _m, value=replacement: value, text, count=1, flags=re.S)"
          if old not in s:
              raise SystemExit('replacement line not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Update author analysis
        run: python scripts/update-author-analysis-evidence-chain.py
      - name: Validate JavaScript
        run: node --check author-analysis.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add author-analysis.js index.html
          git commit -m 'Build evidence-chain author analysis [skip ci]'
          git push
