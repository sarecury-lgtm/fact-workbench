name: Sharpen author analysis language

on:
  push:
    paths:
      - 'scripts/update-author-analysis-trigger.txt'

permissions:
  contents: write

jobs:
  update-author-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite author analysis
        run: python scripts/update-author-analysis.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add author-analysis.js
          git commit -m "Translate author analysis into concrete actions [skip ci]"
          git push
