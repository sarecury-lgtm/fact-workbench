name: Update author analysis evidence chain

on:
  push:
    paths:
      - '.github/workflows/update-author-analysis-evidence-chain.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update author analysis
        run: python scripts/update-author-analysis-evidence-chain.py
      - name: Validate JavaScript
        run: node --check author-analysis.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add author-analysis.js index.html
          git commit -m 'Build evidence-chain author analysis [skip ci]'
          git push
