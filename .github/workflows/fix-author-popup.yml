name: Fix author analysis popup

on:
  push:
    paths:
      - '.github/workflows/fix-author-popup.yml'

permissions:
  contents: write

jobs:
  patch-popup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch popup handling
        run: python scripts/fix-author-popup.py
      - name: Commit popup fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add author-analysis.js
          git commit -m 'Fix ChatGPT popup opening [skip ci]'
          git push
