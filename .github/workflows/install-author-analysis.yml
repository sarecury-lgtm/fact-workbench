name: Install author analysis module

on:
  push:
    paths:
      - ".github/workflows/install-author-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add module loader to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          tag = '  <script src="author-analysis.js?v=1"></script>\n'
          if "author-analysis.js" not in text:
              text = text.replace("</body>", tag + "</body>")
              p.write_text(text, encoding="utf-8")
          PY
      - name: Commit patched index
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load author analysis module [skip ci]"
          git push
