name: Build author analysis module

on:
  push:
    paths:
      - ".github/workflows/build-author-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final module
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          parts = [
              "aa/p1.txt", "aa/p2.txt", "aa/p3.txt",
              "aa/p4a.txt", "aa/p4b.txt", "aa/p5.txt",
              "aa/p6a1.txt", "aa/p6a2a.txt", "aa/p6a2b.txt",
              "aa/p6a2c.txt", "aa/p6a2d.txt", "aa/p6b.txt", "aa/p7.txt",
          ]
          encoded = "".join(Path(p).read_text(encoding="ascii") for p in parts)
          source = base64.b64decode(encoded, validate=True).decode("utf-8")
          Path("author-analysis.js").write_text(source, encoding="utf-8")
          PY
          node --check author-analysis.js
          rm -rf aa
          rm -f .github/workflows/install-author-analysis.yml
          rm -f .github/workflows/build-author-analysis.yml
      - name: Commit final module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize author analysis module [skip ci]"
          git push
